[workspace]
name = "open-duck-mjlab"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
# CUDA 12.8 build of PyTorch (needs NVIDIA driver >= 570).
torch = { version = ">=2.7,<2.10", index = "https://download.pytorch.org/whl/cu128" }
# Installs this package in editable mode, which pulls in mjlab>=1.6,<1.7.
open-duck-mjlab = { path = ".", editable = true }

[tasks]
check = "python -c \"import torch, mjlab, open_duck_mjlab; print('torch', torch.__version__, 'cuda', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else '')\""
list-tasks = "list-envs"
smoke = "play Mjlab-Velocity-Flat-OpenDuckMiniV2-GaitFirst --agent zero --env.scene.num-envs 1"
train-smoke = "train Mjlab-Velocity-Flat-OpenDuckMiniV2-GaitFirst --env.scene.num-envs 64 --agent.max-iterations 10"
train = "train Mjlab-Velocity-Flat-OpenDuckMiniV2-GaitFirst --env.scene.num-envs 8192"
tb = "tensorboard --logdir logs/rsl_rl"

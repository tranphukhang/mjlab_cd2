[project]
name = "open-duck-mjlab"
version = "0.1.0"
description = "MJLab reinforcement-learning workspace for Open Duck Mini V2"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mjlab>=1.6.0,<1.7.0",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]

[tool.ruff]
indent-width = 2
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[project.entry-points."mjlab.tasks"]
open_duck_mjlab = "open_duck_mjlab"
